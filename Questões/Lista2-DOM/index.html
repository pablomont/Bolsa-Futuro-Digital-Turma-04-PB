<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculadora">
        <h1>Calculadora de IMC</h1>
        <p>Preencha os campos abaixo para calcular o seu IMC.</p>
        <br>
        <p>Peso (em kg): <input type="number" id="peso" name="peso" placeholder="Ex: 70"></p>
        <p>Altura (em metros): <input type="number" id="altura" name="altura" placeholder="Ex:1.75"></p>
        <br>
        <button id="botaoCalcular">Calcular</button>
        <h1>Resultado:</h1>
        <p class= "resultado"id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
