<!DOCTYPE html>
<html lang="en">
<head>

    <title>ScoreBoard</title>

<body>
    <p></p>
    <table>
        <tr class="team">
            <td> Time 1 </td>
            <td> Time 2 </td>
        </tr>
        <tr>
            <td id="score1"> 0 </td>
            <td id="score2"> 0 </td>
        </tr>
        <tr>
            <td> <button id="add1"> +1 </button></td>
            <td> <button id="add2"> +1 </button></td>
        </tr>
    </table>
    <script>
        var score1 = localStorage.getItem('score1')
        var score2 = localStorage.getItem('score2')
        if (!score1 || !score2){
            score1 = 0;
            score2 = 0;
        }
        
        let tdScore1 = document.getElementById("score1");
        let tdScore2 = document.getElementById("score2");
        let botao1 = document.getElementById("add1");
        let botao2 = document.getElementById("add2");
        let frase = document.querySelector('p')
        botao1.ariaDisabled = false;
        botao2.ariaDisabled = false;

        botao1.onclick = function() {
            score1++;
            localStorage.setItem('score1', score1)
            tdScore1.innerHTML = score1
            if (score1 == 5){
                tdScore1.style.backgroundColor = 'green';
                tdScore2.style.backgroundColor = 'red';
                frase.innerHTML = 'Time 1 ganhou.';
                botao1.ariaDisabled = true;
                /* ou pode ser também (se definir o id do p e pegar o id dele): frase.textContent = "Time 1 ganhou."*/
            }
        }

        botao2.onclick = function() {
            score2++;
            localStorage.setItem('score2', score2)
            tdScore2.innerHTML = score2
            if (score2 == 5){
                tdScore2.style.backgroundColor = 'green';
                tdScore1.style.backgroundColor = 'red';
                frase.innerHTML = 'Time 2 ganhou.'
            }
        }

            /*fazer depois*/
        }
        

    </script>
</body>
</html>
