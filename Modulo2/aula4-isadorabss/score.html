<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
    <style>
        table{
            border: 2px solid black;
            border-collapse: collapse;
            margin: 0 auto;
            text-align: center;
        }
        td{
            border: 2px solid black;
        }
        #team1{
            background-color: #D88fd8;
        }
        #team2{
            background-color: #ffad0f;
        }
        #add1{
            background-color: #D88fd8;
        }
        #add2{
            background-color: #ffad0f;
        }
        p{
            text-align: center;
        }
    </style>
</head>
<body>
    <p></p>
    <table>
        <tr>
            <td id="team1">Time 1</td>
            <td id="team2">Time 2</td>
        </tr>
        <tr>
            <td id="score1">0</td>
            <td id="score2">0</td>
        </tr>
        <tr>
            <td><button id="add1">+1</button></td>
            <td><button id="add2">+1</button></td>
        </tr>
    </table>
    <script>
        var score1 = 0;
        var score2 = 0;

        let btn = document.getElementById("add1")
        btn.onclick = function(){
            score1 = score1 + 1

            let tdScore1 = document.getElementById("score1")
            let tdScore2 = document.getElementById("score2")

            tdScore1.innerHTML = score1

            if(score1 == 5){
                tdScore1.style.background = "green"
                tdScore2.style.background = "red"

                let feedback = document.querySelector('p')
                feedback.innerHTML = 'Time 1 venceu'
            }
        }
        let btn2 = document.getElementById("add2")
        btn2.onclick = function(){
            score2 = score2 + 1

            let tdScore1 = document.getElementById("score1")
            let tdScore2 = document.getElementById("score2")

            tdScore2.innerHTML = score2

            if(score2 == 5){
                tdScore1.style.background = "red"
                tdScore2.style.background = "green"

                let feedback = document.querySelector('p')
                feedback.innerHTML = 'Time 2 venceu'
            }
        }
        
    </script>
</body>
</html>
