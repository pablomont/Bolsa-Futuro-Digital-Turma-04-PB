<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <style>
        body {
            background-color: #222;
        }

        .c1 {
            background-color: red;
            /*float: right; --> só com o float os outros elementos se movem para preencher o espaço*/
            clear: both;
            float: left;
        }

        .c2 {
            background-color: green;
            /* clear: both; -- > corrige para qualquer direção*/
            float: left;
        }

        .c3 {
            background-color: blue;
            clear:both;
            float: left;
        }

        .c4 {
            background-color: orange;
            clear:both;
            float: right;
        }

        div {
            height: 150px;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
    
</body>
</html>
