<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Overflow</title>
    <style>
        div{
            font-size: 40px;
            height: 100px;
            width: 260px;
            border: solid 3px;
            overflow: hidden;
            overflow: scroll; /*coloca barras de rolamento dentro da border*/
            overflow-x: scroll;
            overflow-y: hidden; /*so a barra de baixo*/
        }
    </style>
</head>
<body>
    <div>
        TudoFuncionaMuitoBemEmCSS!!!
        Texto muito grande para caber nessa div.
        Já pensou em qual será o comportamento padrão?
    </div>
    
</body>
</html>
