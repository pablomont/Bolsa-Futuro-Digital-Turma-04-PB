<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            padding: 20px;
        }

        .box {
            width: 100px;
            height: 100px;
            margin: 10px;
        }

        .verde {
            background-color: seagreen;
            float: left;
        }

        .azul {
            background-color: blueviolet;
            float: left;
            clear: left;
        }

        .vermelho {
            background-color: crimson;
            float: right;
        }

        .amarelo {
            background-color: gold;
            float: right;
            clear: right;
        }
    </style>
</head>
<body>
    <div class="box verde"></div>
    <div class="box azul"></div>
    <div class="box vermelho"></div>
    <div class="box amarelo"></div>
</body>
</html>
