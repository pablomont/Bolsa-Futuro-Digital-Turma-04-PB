<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: purple;
        }

        div {
            font-size: 40px;
            margin: 5px;
        }

        .flex-container {
            display: flex;
            /*height: 200px;*/
            /*width: 50%;*/
            flex-direction: row;
            flex-direction: row-reverse;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row;
            flex-wrap: wrap;
            flex-wrap: wrap-reverse;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: flex-end;

        }

        .flex-container>div {
            background-color: orange;
        }
    </style>
</head>

<body>
    <div class="flex-container">
        <div style="font-size: medium;">A</div>
        <div style="font-size: x-large;">B</div>
        <div style="font-size: small;">Item 2</div>
        <div style="font-size: medium;">Item 3</div>
    </div>
</body>

</html>
