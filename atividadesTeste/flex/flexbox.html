<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        body{
            background-color: purple;
        }
        div{
            font-size: 40px;
            margin:5px;
        }
        .flex-container{
            display:flex;
            flex-direction: row;
            /*height: 200px;*/
            /*width: 90%;*/
            /*flex-wrap: wrap-reverse; solução pra evitar over-flow na div*/
            justify-content: space-between;
            align-items: flex-end; /*aloinhar de forma vertical*/
        }
        .flex-container div{
            background-color: orange;
        }

    </style>
</head>
<body>

    <div class="flex-container">
        <div style="font-size:medium">A</div>
        <div style="font-size:x-large">B</div>
        <div style="font-size:small">C</div>
        <div style="font-size:larger">D</div>
        <div>E</div>
    </div>

</body>
</html>
