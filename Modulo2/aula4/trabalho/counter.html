<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>
<body>

    <h1>0</h1>
    <button onclick="incrementarContador()">Contador</button>

    <script>
        function incrementarContador() {
            let contador = parseInt(localStorage.getItem('counter')) || 0;
            contador++;

            document.querySelector('h1').innerHTML = contador;

            localStorage.setItem('counter', contador);
        }

        document.addEventListener('DOMContentLoaded', function () {
            let contador = parseInt(localStorage.getItem('counter')) || 0;
            document.querySelector('h1').innerHTML = contador;
        });
    </script>
</body>
</html>
