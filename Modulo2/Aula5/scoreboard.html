<!DOCTYPE html>
<html lang="en">
<head>
    <title>Scoreboard</title>
    <style>
        table {
            border: 2px solid black;
            border-collapse: collapse;
            margin: 0 auto;
            text-align: center;
        }

        td{
            border: 2px solid black
        }

        #team1{
            background-color: #D8Bfd8;
        }

        #team2{
            background-color: #FFA07A;
        }

        #add1{
            background-color: #D8Bfd8;
        }
        #add2{
            background-color: #FFA07A;
        }

        p{
            text-align: center;
        }
    </style>
</head>
<body>
    <p></p>
    <table>
        <tr>
            <td id="team1">Time 1</td>
            <td id="team2">Time 2</td>
        </tr>
        <tr>
            <td id="score1">0</td>
            <td id="score2">0</td>
        </tr>
        <tr>
            <td><button id="add1">+1</button></td>
            <td><button id="add2">+1</button></td>
        </tr>
    </table>
    <script>

        //Essa função irá recuperar do localStorage os valores de score1 e score2 e os adicionar ao html sempre que a página for carregada
        function addScore1AndScore2() {
            let score1 = localStorage.getItem('score1')
            document.getElementById("score1").innerHTML = score1 ? score1 : 0  

            let score2 = localStorage.getItem('score2')
            document.getElementById("score2").innerHTML = score2 ? score2 : 0  
        }

        //Aqui fazemos a ligação entre o evento DOMContentLoaded e a função que queremos que seja executada quando o evento for disparado
        document.addEventListener('DOMContentLoaded', addScore1AndScore2); 

        let btn = document.getElementById("add1")
        btn.onclick = function() {
            let score1 = localStorage.getItem('score1')
            score1++
            let tdScore1 = document.getElementById("score1")
            tdScore1.innerHTML = score1
            localStorage.setItem('score1', score1)

            if(score1 == 5){
                tdScore1.style.backgroundColor = 'green'
                tdScore2.style.backgroundColor = 'red'

                let feedback = document.querySelector('p')
                feedback.innerHTML = 'Time 1 venceu'
            }
        }

        let btn2 = document.getElementById("add2")
        btn2.onclick = function() {
            let score2 = localStorage.getItem('score2')
            score2++
            let tdScore2 = document.getElementById("score2")
            tdScore2.innerHTML = score2
            localStorage.setItem('score2', score2)

            if(score2 == 5){
                tdScore2.style.backgroundColor = 'green'
                tdScore1.style.backgroundColor = 'red'

                let feedback = document.querySelector('p')
                feedback.innerHTML = 'Time 2 venceu'
            }
        }
    </script>
</body>
</html>
