<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altura e largura</title>
    <style>
        html {
            height: 100%;
        }
        body {
            font-size: 40px;
            background-color: coral;
            height: 100%;
            margin: 0;
        }
        div {
            background-color: seagreen;
            height: 50%;   
        }
        span {
            background-color: dodgerblue;
        }
        div, span {
            width: 250px;
            height: 70%;
            
        }
    </style>
</head>
<body>
    <div>Titulo</div>
    <span>Subtitulo</span>
</body>
</html>
