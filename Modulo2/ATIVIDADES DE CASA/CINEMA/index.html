<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cinema</title>
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <h1>Cinema</h1>
    <h2><a href="ESTADOS/pb.html">Paraíba</a></h2>
    <h2><a href="ESTADOS/sp.html">São Paulo</a></h2>

    <button onclick="alterarTema()">Alternar Tema</button>

    <script>
        function alterarTema() {
            let link = document.querySelector("link");

            if (link.href.includes("estilo-dark.css")) {
                link.href = "CSS/estilo.css";
            } else {
                link.href = "CSS/estilo-dark.css";
            }
        }
    </script>
</body>
</html>
