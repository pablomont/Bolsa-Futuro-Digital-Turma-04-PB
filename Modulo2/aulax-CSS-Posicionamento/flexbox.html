<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox #01</title>
    <style>
        
        body {          
            background-color: purple;
        }
        div {
            display: inline;
            font-size: 40px;
            margin: 5px;
        }
        .flex-container {
            display: flex;
            height: 100px;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-evenly   ;

        }
        .flex-container div {
            background-color: orange;
        }
        
        
        
    </style>
</head>
<body>
    <div class="flex-container">
        <div style="font-size: medium;">A</div>
        <div style="font-size: x-large;">B</div>
        <div style="font-size: small;">C</div>
        <div style="font-size: medium;">D</div>
    </div>
</body>
</html>
