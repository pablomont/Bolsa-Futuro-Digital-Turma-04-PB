<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow</title>
    <style>
        body {
            background-color: #222;
        }
        .c1 {
            background-color: red;
            float: left;
        }
        .c2 {
            background-color: green;
            float: left;
        }
        .c3 {
            background-color: blue;
            clear: left;
            float:left;
        }
        .c4 {
            background-color: orange;
            float: left;
        }

        div {
            height: 150px;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
</body>
</html>
