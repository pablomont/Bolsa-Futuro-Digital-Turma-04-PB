<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <Style>
        body{
            background-color: #222;
        }

        .c1 {
            float: left;
            background-color: red;
        }

        .c2 {
            float: left;
            background-color: green;
        }

        .c3 {
            clear: left;
            float: left;
            background-color: blue;
        }

        .c4 {
            float: left;
            background-color: orange;
        }

        div {
            height: 150px;
            width: 150px;
        }
    </Style>
</head>
<body>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
</body>
</html>
