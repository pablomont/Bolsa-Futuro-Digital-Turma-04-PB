<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <style>
        body {
            background-color: black;
        }
        .c1 {
            background-color: red;
            float: left;
            
        }

        .c2 {
            background-color: green;
            float: left;
        }

        .c3 {
            background-color: blue;
            float: left;
            clear: left;
        }

        .c4 {
            background-color: yellow;
            float: left;
            
        }   

        div {
            height: 150px;
            width: 150px;
        }

        .c1, .c2, .c3, .c4 {
            
        }
    </style>
</head>
<body>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
</body>
</html>
