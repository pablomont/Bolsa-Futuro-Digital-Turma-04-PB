<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Display</title>
    <style>
        body {
            font-size: 40px ;
            color: white;
            background-color: coral;}

        ul {padding: 0;}
        div {background-color: green;}
        span {background-color: rgb(0, 60, 255);}
        li {background-color: rgb(195, 0, 255); }

        div,
        span,
        li , ul {
            width: 80%;
            width: 200px;
            height: 100px;
            height: 200px;
            padding-top: 38px;
            text-align: left;
            display: block;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div>Tetxo 1</div>
    <span>Texto 2</span>
    <span>Texto 3</span>
    <ul>
        <li>Iteam 1</li>
        <li>Iteam 2</li>
        <li>Iteam 3</li>
    </ul>
</body>
</html>
