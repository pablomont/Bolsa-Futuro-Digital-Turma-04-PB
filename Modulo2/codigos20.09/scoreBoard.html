<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <table>
        <tr>
            <td>Time 1</td>
            <td>Time 2</td>
        </tr>
        <tr>
            <td id="score1">0</td>
            <td id="score2">0</td>
        </tr>
        <tr>
            <td><button id="add1">+1</button></td>

<script>
    var score1 = 0;
    let btn = document.getElementById("add1");

        score1 += 1;
        let tdScore1 = document.getElementById("score1");
        tdScore1.innerHTML = score1;
    };
    console.log(btn.innerHTML);
