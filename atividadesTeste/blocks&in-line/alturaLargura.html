<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altura&Largura</title>
    <style>
        html{
            height: 100%;
        }
        body{
            height: 100%;
            font-size: 40px;
            background-color: coral;
            margin: 0;}
        div {
            background-color: seagreen;
            height: 50%;}
        span {
            background-color: dodgerblue;}
        div, span{
            width: 100%; /*A porcentagem é em relação à tag pai, e não à tela*/
            height: 90%;
        }
    </style>
</head>
<body>
    <div>Título</div>
    <span>Subtítulo</span>
</body>
</html>
