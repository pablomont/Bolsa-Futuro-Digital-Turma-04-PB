<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados</title>
    <link rel="stylesheet" href="../css/estilo.css" id="theme-stylesheet">
</head>
<body>
    <h1>Paraíba</h1>
    <div class="filmes-container">
    <a href="../index.html">Voltar ao índice</a>
    <p>Lisbela e o prisoneiro - 20:00 - <span class="destaUnico">Hoje</span></p>
    <p>Meu nome não é Jhonny - <span class="destaUnico">hoje</span></p>
    <p>O auto da compadecida - 15:00 - <span class="destaDois">Amanhã</span></p>
    </div>
     <script>
        document.addEventListener('DOMContentLoaded', function() {
            const temaSalvo = localStorage.getItem('theme');
            if (temaSalvo === 'dark') {
                const linkElement = document.querySelector('#theme-stylesheet');
               
                linkElement.href = '../css/estilo_dark.css';
            }
        });
    </script>
</body>
</html>
