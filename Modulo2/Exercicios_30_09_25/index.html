<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <div class="calculadora">
        <h1>Calculadora de IMC</h1>

        <p>Preencha os campos abaixo para calcular seu IMC.</p>

        <span>Peso (em kg):</span>
        <input type="number" placeholder="Ex: 70" id="peso">
        <br><br>
        <span>Altura (em metros):</span>
        <input type="number" placeholder="Ex: 1.75" id="altura">

        <br><br>

        <button id="btn-calcular">Calcular</button>

        <h2 id="resultado">Resultado:</h2>
        <p></p>
    </div>

    <script src="./js/IMC.js"></script>
</body>
</html>
