<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scoreboard</title>
    <style>
        table{
            border: 2px solid black;
            border-collapse: collapse; 
            text-align: center;
            margin: 20px auto;
        }
        
            td, th {
             border: 1px solid black;
             padding: 10px 20px;
        }

    </style>

</head>
<body>
    <table>
        <h1>Team 1 vs Team 2</h1>
        <tr>
            <td >Team 1</td>
            <td>Team 2</td>
        </tr>
        <tr>
            <td id="score1">0</td>
            <td id="score2">0</td>
        </tr>
        <tr>
            <td><button id="add1">+1</button></td>
            <td><button id="add2">+1</button></td>
        </tr>
    </table>

    <script>
        var score1 = 0
        var score2 = 0
        
        let btn1 = document.getElementById("add1")
        btn1.onclick = function(){
            score1 = score1 + 1
            let tdScore1 = document.getElementById("score1")
            tdScore1.innerHTML = score1
        }

        let btn2 = document.getElementById("add2")
        btn2.onclick = function(){
            score2 = score2 + 1
            let tdScore2 = document.getElementById("score2")
            tdScore2.innerHTML = score2;

           tdScore1.innerHTML =score1

            if(score1== $) (
            tdScore1.style.backgroundColor = 'green' 
            
           )

            
        }
    </script>
</body>
</html>
