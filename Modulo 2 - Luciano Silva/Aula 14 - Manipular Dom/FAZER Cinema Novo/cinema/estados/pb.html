<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cinema - Paraíba</title>
    <link id="temaCss" rel="stylesheet" href="../css/dark.css">
</head>

<body>
    <h1>Paraíba</h1>
    <button><a href="../index.html">< Página Inicial</a></button>
    <div class="destaque">
    <p class="hoje">Poderoso Chefão - 20:00 - Hoje</p>
    <p class="amanha">Pup Fiction - 21:00 - Amanhã</p>
    <p class="amanha">Um Sonho de Liberdade - 15:00 - Amanhã</p>
    </div>

    <script>

        const temaCss = document.querySelector('#temaCss');

         // Carrega o tema salvo ao abrir a página
        document.addEventListener('DOMContentLoaded', function() {
             const temaSalvo = localStorage.getItem('theme');
             if (temaSalvo === 'light') {
                temaCss.href = '../css/light.css'; // troca para claro
            } else {
                temaCss.href = '../css/dark.css';  // troca para escuro
            }
        });

    </script>
</body>

</html>
