<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de IMC</h1>
        <div>
            <p>Digite seu peso(kg)</p>
            <input type="number" class="input" id="peso" placeholder="Ex: 70">
        </div>
        <div>
            <p>Digite sua altura(m)</p>
        <input type="number" class="input" id="altura" placeholder="Ex: 1.75" step="0.01">
            <br>
        <button onclick="calcularIMC()" id="button">Calcular IMC</button>
    
        <div id="container-resultado">
            <h2>Resultado:</h2>
        <p id="resultado"></p>
    </div>

    </div>



    <script src="imc.js"></script>
</body>
</html>
