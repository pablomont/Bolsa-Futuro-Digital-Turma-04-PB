<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        body{
        font-size: 40px;
        color: antiquewhite;
        background-color: coral;
        }

        ul {
            padding: 0;
        }
        div {
            background-color: seagreen;
        }
        span {
            background-color: dodgerblue;
        }
        li {
            background-color: purple;
        }

        div, span, li, ul{
            width: 80%;
            width: 200px;
            height: 100px;
            padding-top: 30px;
            text-align: center;
            display: block;
            display: inline;
            display: inline-block;
        }

    </style>
</head>
<body>
    <div>Texto 1</div>
    <span>Texto 2</span>
    <span>Texto 3</span>
    <ul>
        <li>Texto 1</li>
        <li>Texto 2</li>
        <li>Texto 3</li>
    </ul>
</body>
</html>
