<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-size: 40px ;
            color: white;
            background-color: rgb(110, 32, 129);}

        div{
            font-size:40px;
            margin: 5px;
        }

        .flex-container {
            display: flex;
            width: 20%;
            flex-direction: row;
            flex-direction: row-reverse;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-wrap: wrap;
            flex-wrap: nowrap;
            flex-wrap: wrap-reverse;
            justify-content: flex-end;
            justify-content: center;
            justify-content: space-between;
            

        }

        .flex-container div{
            background-color: rgb(255, 123, 0);
        }
    </style>

</head>
<body>
<div class="flex-container">
    <div style="font-size: medium">A</div>
    <div style="font-size: x-large;">B</div>
    <div style="font-size: small">C</div>
    <div style="font-size: medium;">D</div>
</div>
</body>
</html>
