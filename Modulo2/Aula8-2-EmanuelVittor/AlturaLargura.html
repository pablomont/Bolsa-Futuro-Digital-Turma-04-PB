<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altura e Largura</title>
    <style>

        html{
            height: 100%;
        }

        body{
            font-size: 40px;
            background-color: coral;
            height: 100%;
            margin: 0;
        }

        div{
            background-color: seagreen;
            height: 50%;
        }

        span {
            background-color: dodgerblue;
        }

        div, span{
            width: 90%;
            height: 90%;
        }
    </style>
</head>
<body>
    <div>Título</div>
    <span>Subtítulo</span>
</body>
</html>
