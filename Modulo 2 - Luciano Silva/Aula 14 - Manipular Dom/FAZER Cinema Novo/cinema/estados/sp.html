<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cinema - São Paulo</title>
    <link id="temaCss" rel="stylesheet" href="../css/dark.css">
</head>

<body>
    <a href="../index.html">Voltar para a página inicial</a>
    <h1>São Paulo</h1>
    <p class="hoje">Poderso Chefão - 20:00 - Hoje</p>
    <p class="amanha">Pup Ficition - 21:00 - Amanhã</p>
    <p class="amanha">Um sonho de liberdade - 15:00 - Amanhã</p>

    <script>

        const temaCss = document.querySelector('#temaCss');

         // Carrega o tema salvo ao abrir a página
        document.addEventListener('DOMContentLoaded', function() {
             const temaSalvo = localStorage.getItem('theme');
             if (temaSalvo === 'light') {
                temaCss.href = '../css/light.css'; // troca para claro
            } else {
                temaCss.href = '../css/dark.css';  // troca para escuro
            }
        });

    </script>
</body>

</html>
