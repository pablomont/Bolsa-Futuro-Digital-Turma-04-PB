<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cinema</title>
    <link id="temaCss" rel="stylesheet" href="css/dark.css">
</head>

<body>
    <h1>Cinema</h1>
    <h2><a href="estados/pb.html">Paraíba</a></h2>
    <h2><a href="estados/sp.html">São Paulo</a></h2>
    <button id="tema">Trocar Tema</button>

    <script>

        const temaCss = document.querySelector('#temaCss');
        const btn = document.querySelector('#tema');

        // Alterna tema, salva no localStorage e muda texto do botão
        btn.onclick = function () {
            if (temaCss.href.includes('dark.css')) {
                temaCss.href = 'css/light.css'; // troca para claro
                localStorage.setItem('theme', 'light');
            } else {
                temaCss.href = 'css/dark.css';  // troca para escuro
                localStorage.setItem('theme', 'dark');
            }
        // Muda texto do botão
        btn.textContent = temaCss.href.includes('css/dark.css') ? "Para o Sol" : "Para a Lua";
        }

        // Carrega tema salvo ao abrir página e muda texto do botão
        document.addEventListener('DOMContentLoaded', function () {
            const temaSalvo = localStorage.getItem('theme');
            if (temaSalvo === 'light') {
                temaCss.href = 'css/light.css'; // troca para claro
            } else {
                temaCss.href = 'css/dark.css';  // troca para escuro
            }
        
        // Muda texto do botão
        btn.textContent = temaCss.href.includes('css/dark.css') ? "Para o Sol" : "Para a Lua";
        });

    </script>
</body>

</html>
