<!DOCTYPE html>
<html lang="en">
<head>
    <title>Scoreboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

            </tr>
            <tr>

                <td><button id="add2">+1</button></td>
            </tr>    
        </table>
    </main>
    <script>

        let teamOneScore = document.getElementById("team1-score")
        let score1 = 0
        buttonOne.onclick = function() {
            if((score1 < 5) && (score2 < 5)){
                score1++
                teamOneScore.innerHTML = score1 
            } 
            if(score1 > 4){
                teamOneScore.style.backgroundColor = "lightgreen"
                teamTwoScore.style.backgroundColor = "red"
            }
        
        }

        let score2 = 0
        let teamTwoScore = document.getElementById("team2-score")
        let buttonTwo = document.getElementById("add2")
        buttonTwo.onclick = function() {
            if((score2 < 5) && (score1 < 5)){

</body>
</html>
