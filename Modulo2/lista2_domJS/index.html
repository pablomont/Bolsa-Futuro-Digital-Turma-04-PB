<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu">
        <h1>Calculadora de IMC</h1>
        <p>Preencha os campos abaixo para calcular seu IMC</p>
    
        <span>Peso (em kg):</span>
        <input id="peso" type="number" placeholder="Ex: 70">
        <br><br> 
        <span>Altura (em metros):</span>
        <input id="altura" type="number" placeholder="Ex: 1.75">
        <br><br>
        
        <button id="calcular">Calcular</button><br>

        <h2>Resultado:</h2>
        <div id="resultado" class="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
