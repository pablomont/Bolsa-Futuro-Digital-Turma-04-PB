<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Flexbox #01</title>
    <style>
        body{
            background-color: purple;
        }
        div{
            font-size: 40px;
            margin: 5px;
        }
        .flex-container{
            display: flex;
            height: 200px;
            width: 5%;
            flex-direction: row;
            flex-direction: row-reverse;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row;
            flex-wrap: wrap;
            flex-wrap: wrap-reverse;
            flex-wrap: nowrap;
            justify-content: flex-end;
            justify-content: center;
            justify-content: flex-end;
            justify-content: space-between;
            justify-content: space-around;
            justify-content: space-evenly;
            align-items: flex-end;
            align-items: stretch;
            align-items: baseline;
            flex-wrap: wrap;
            align-items: flex-end;
            align-items: flex-start;
            
        }
        .flex-container div{
            background-color: orange;
        }
        
    </style>
</head>
<body>
    <div class="flex-container">
    <div style="font-size:medium;">A</div>
    <div style="font-size:x-large;">B</div>
    <div style="font-size:small;">C</div>
    <div style="font-size:medium;">D</div>
    </div>
</body>
</html>
