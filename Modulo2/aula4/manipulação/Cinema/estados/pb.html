<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cinema - Paraíba</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <h1>Paraíba</h1>
    <a href="../index.html">Voltar à página inicial</a>

    <div class="filmes-container">
        <p>Olga - 20:00 - <span class="hoje">Hoje</span></p>
        <p>O Retrato de Dorian Gray  - 21:00 - <span class="hoje">Hoje</span></p>
        <p>O Auto da Compadecida - 15:00 - <span class="amanha">Amanhã</span></p>
    </div>

    <script>
        function carregarTema() {
            const temaSalvo = localStorage.getItem('theme');
            let linkCSS = document.querySelector('link');

            if (temaSalvo === 'dark') {
                linkCSS.href = 'css/estilo-dark-mode.css';
            }
        }

        document.addEventListener('DOMContentLoaded', carregarTema);
    </script>
</body>
</html>
