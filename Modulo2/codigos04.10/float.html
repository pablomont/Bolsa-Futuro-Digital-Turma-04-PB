<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <style>
        body{
            background-color: #222;
        }
        .C1{
            background-color: red;
            float:left
        }
        .C2{
            background-color: green;
            float:left;
        }
        .C3{
            background-color: blue;
            float: left;
            clear: left;
        }
        .C4{
            background-color: orange;
            float: left;
        }
        div{
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>
    <div class="C1"></div>
    <div class="C2"></div>
    <div class="C3"></div>
    <div class="C4"></div>
</body>
</html>
