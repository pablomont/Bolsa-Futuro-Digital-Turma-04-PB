<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paraíba</title>
    <link rel="stylesheet" id="estilo" href="css/estilo.css">

</head>
<body>
    <h1>Filmes em cartaz - Paraíba:</h1>
   
    <div class="filmes-container">    
        <p >Lisbela e o Prisioneiro - 20:00 - <span class="hoje">Hoje</span></p><br>
        <p >Meu nome não é Jhonny - 21:00 - <span class="hoje">Hoje</span></p><br>
        <p >O Auto da Compadecida - 15:00 - <span class= "amanha">Amanhã</span> </p><br>
     </div>
   
    <a href="../index.html">Voltar para a página anterior</a>

    <script>
        document.addEventListener('DOMContentLoaded', carregarTema); 

        function carregarTema() {
            const themeState = localStorage.getItem('themeState');
            const temaLink = document.getElementById('estilo');
            
            const stateTemaClaro = 'css/estilo.css'; 
            const stateTemaEscuro = 'css/estiloDark.css'; 
            
            if (themeState === 'dark') {
                temaLink.href = stateTemaEscuro;
            } else {
                temaLink.href = stateTemaClaro;
            }
        }
    </script>
</body>
</html>
