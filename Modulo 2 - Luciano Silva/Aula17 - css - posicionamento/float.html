<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>float</title>
    <style>
        body {
            background-color: rgb(37, 37, 37);}

        .c1 {
            background-color: rgb(255, 0, 0);
            float: right;
    
        }
        div {
            height: 150px; 
            width: 150px;
        }
        .c2 {
            background-color: rgb(0, 255, 42);
            float:left;
            float:unset;
        }
        div {
            height: 150px; 
            width: 150px;
        }
        
        .c3 {
            background-color: rgb(47, 0, 255);
            float: right;
            float:unset
        }

        div {
            height: 150px; 
            width: 150px;
        }

        .c4 {
            background-color: orange;
            float: right;
        }
        div {
            height: 150px; 
            width: 150px;
        }

    </style>
</head>
<body>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
</body>
</html>
