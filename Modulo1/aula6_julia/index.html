<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <link rel="stylesheet" href="css/estilo.css" id="theme-stylesheet">
</head>
<body>
    <h1>Cinema</h1>
    <h2><a href="estados/pb.html">Paraíba</a></h2>
    <h2><a href="estados/sp.html">São Paulo</a></h2>
    <button onclick="alterarTema()">Alterar tema</button>

    <script>
       function carregaTema(){
        const temaSalvo = localStorage.getItem('theme');
        if(temaSalvo === 'dark'){
            const linkElement = document.querySelector('#theme-stylesheet');
            linkElement.href='css/estilo_dark.css' //Alterar o arquivo para dark 
        }
       }
       
       function alterarTema(){
        const linkElement = document.querySelector('#theme-stylesheet');
        let novoTema; 
        
        if(linkElement.href.includes('estilo_dark.css')){
            linkElement.href = 'css/estilo.css'; //tema claro
            novoTema = 'light'
        }else{
            linkElement.href='css/estilo_dark.css';
            novoTema = 'dark';
        }
        
        localStorage.setItem('theme', novoTema);
    
       }
         document.addEventListener('DOMContentLoaded', function() {
            carregaTema();
        });
       </script>
</body>
</html>
